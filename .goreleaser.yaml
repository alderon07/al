version: 2

project_name: alias-lens

builds:
  - id: alias-lens
    main: ./cmd/alias-lens
    binary: alias-lens
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - ids:
      - alias-lens
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - THIRD_PARTY_LICENSES.txt
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'

release:
  prerelease: auto
